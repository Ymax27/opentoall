<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenToAll">
  <defs>
    <linearGradient id="ota-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2236"/><stop offset="1" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="ota-indigo" x1="26" y1="16" x2="70" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f6cff"/><stop offset="1" stop-color="#3a2ad6"/>
    </linearGradient>
  </defs>

  <!-- App-icon background -->
  <rect width="96" height="96" rx="26" fill="url(#ota-bg)"/>

  <!-- G ring (donut, open on the right) -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M42 20 a28 28 0 1 0 0.01 0 Z M42 32 a16 16 0 1 1 -0.01 0 Z"
        fill="url(#ota-indigo)"/>
  <!-- open the right side -->
  <rect x="47" y="43" width="26" height="18" rx="6" fill="url(#ota-bg)"/>
  <!-- G tongue -->
  <rect x="43" y="44" width="18" height="8.5" rx="4.25" fill="url(#ota-indigo)"/>

  <!-- i stem -->
  <rect x="66" y="39" width="9" height="41" rx="4.5" fill="url(#ota-indigo)"/>
  <!-- i dot (tilted terracotta) -->
  <rect x="64.5" y="21" width="13.5" height="11" rx="3" fill="#fd651e" transform="rotate(16 71 26.5)"/>

  <!-- decorative accent dots -->
  <circle cx="17" cy="81" r="2.6" fill="#ffffff"/>
  <rect x="24" y="79" width="5" height="5" rx="1.2" fill="#fd651e" transform="rotate(12 26.5 81.5)"/>
</svg>
