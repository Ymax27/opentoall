<div class="px-5 py-6 lg:px-6 lg:py-8">
    <p class="eyebrow text-secondary">{{ index }}</p>
    <p class="mt-3 font-display text-[2.75rem] font-semibold leading-none tracking-[-0.045em] ink-strong tabular-nums lg:text-[3.75rem]">{{ value }}</p>
    <p class="mt-3 font-code text-[10px] uppercase tracking-[0.14em] ink-muted">{{ label }}</p>
    {% if note %}<p class="mt-1 font-code text-[10px] ink-faint">{{ note }}</p>{% endif %}
</div>
