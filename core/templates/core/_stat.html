<div class="px-1 py-1">
    <p class="font-code text-[10px] uppercase tracking-[0.14em] text-[#7D56FC]">{{ index }}</p>
    <p class="mt-2 font-serif text-[clamp(2rem,3vw,2.75rem)] font-semibold leading-none tracking-[-0.03em] text-[#015239] tabular-nums">{{ value }}</p>
    <p class="mt-2 font-code text-[10px] uppercase tracking-[0.14em] text-[#41604F]">{{ label }}</p>
    {% if note %}<p class="mt-1 text-xs text-[#6B8A79]">{{ note }}</p>{% endif %}
</div>
