<div class="group relative overflow-hidden bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-7 shadow-card hover:shadow-card-hover transition-shadow duration-200">
    <div class="relative">
        <div class="w-12 h-12 rounded-xl bg-{{ tone }}/12 text-{{ tone }} grid place-items-center mb-5">
            <span class="material-symbols-outlined text-[26px]" style="font-variation-settings:'FILL' 1;">{{ icon }}</span>
        </div>
        <h3 class="font-heading font-semibold text-xl text-on-surface mb-2">{{ title }}</h3>
        <p class="text-on-surface-variant leading-relaxed">{{ text }}</p>
    </div>
</div>
