<div class="group relative overflow-hidden bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-7 shadow-card hover:shadow-card-hover hover:-translate-y-1 transition-all duration-300">
    <span class="material-symbols-outlined absolute -right-3 -top-3 text-[110px] text-{{ tone }} opacity-[0.06] pointer-events-none">{{ icon }}</span>
    <div class="relative">
        <div class="w-14 h-14 rounded-xl bg-{{ tone }}/12 text-{{ tone }} grid place-items-center mb-5 group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-[28px]" style="font-variation-settings:'FILL' 1;">{{ icon }}</span>
        </div>
        <h3 class="font-heading font-semibold text-xl text-on-surface mb-2">{{ title }}</h3>
        <p class="text-on-surface-variant leading-relaxed">{{ text }}</p>
    </div>
</div>
