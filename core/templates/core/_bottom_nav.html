{% with active=request.resolver_match.url_name|default:"" %}
<!-- Mobile bottom navigation -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 z-50 border-t border-outline-variant/40 bg-surface/90 backdrop-blur-xl" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="grid grid-cols-4 h-16">
        {% for slug, label, icon in nav_links %}
        <a href="{% url slug %}" class="flex flex-col items-center justify-center gap-0.5 transition-colors {% if active == slug %}text-primary{% else %}text-on-surface-variant{% endif %}">
            <span class="material-symbols-outlined text-[24px]" style="{% if active == slug %}font-variation-settings:'FILL' 1;{% endif %}">{{ icon }}</span>
            <span class="text-[11px] font-medium">{{ label }}</span>
        </a>
        {% endfor %}
        {% if user.is_authenticated %}
        <a href="{% if user.profile.github_username %}{% url 'profile' user.profile.github_username %}{% else %}{% url 'home' %}{% endif %}" class="flex flex-col items-center justify-center gap-0.5 {% if active == 'profile' %}text-primary{% else %}text-on-surface-variant{% endif %}">
            <span class="material-symbols-outlined text-[24px]">person</span>
            <span class="text-[11px] font-medium">Profil</span>
        </a>
        {% else %}
        <a href="{% url 'account_login' %}" class="flex flex-col items-center justify-center gap-0.5 text-on-surface-variant">
            <span class="material-symbols-outlined text-[24px]">login</span>
            <span class="text-[11px] font-medium">Connexion</span>
        </a>
        {% endif %}
    </div>
</nav>
<div class="lg:hidden h-16" style="height: calc(4rem + env(safe-area-inset-bottom));"></div>
{% endwith %}
