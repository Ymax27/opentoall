<section id="why" class="border-t border-on-surface/12">
    <div class="max-w-content mx-auto px-4 lg:px-8 py-14 lg:py-16">
        <div class="grid gap-8 lg:grid-cols-12 lg:gap-12">
            <header class="lg:col-span-4" aria-labelledby="why-heading">
                <p class="eyebrow">02 / Pourquoi</p>
                <h2 id="why-heading" class="mt-4 font-display text-2xl font-semibold tracking-[-0.03em] text-on-surface lg:text-[1.9rem] lg:leading-tight">
                    Pourquoi OpenToAll ?
                </h2>
                <p class="mt-3 max-w-sm leading-relaxed text-on-surface-variant">
                    Chercher « good first issue » sur GitHub seul ne dit pas si le dépôt est clonable, accueillant, ou déjà pris.
                </p>
            </header>

            <dl class="lg:col-span-8 grid gap-x-10 sm:grid-cols-2">
                {% for item in why_items %}
                <div class="border-t border-on-surface/12 py-5">
                    <dt class="font-display text-lg font-semibold tracking-[-0.015em] text-on-surface">{{ item.title }}</dt>
                    <dd class="mt-1.5 leading-relaxed text-on-surface-variant">{{ item.text }}</dd>
                </div>
                {% endfor %}
            </dl>
        </div>
    </div>
</section>
