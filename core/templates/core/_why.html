<section id="why" class="band-ink">
    <div class="max-w-content mx-auto px-4 lg:px-8 py-16 lg:py-24">
        <div class="grid gap-10 lg:grid-cols-12 lg:gap-12">
            <header class="lg:col-span-4" aria-labelledby="why-heading">
                <p class="eyebrow text-secondary">02 / Pourquoi</p>
                <h2 id="why-heading" class="mt-4 font-display text-[clamp(2rem,3.4vw,3rem)] font-semibold leading-[1.02] tracking-[-0.04em] ink-strong">
                    Pourquoi OpenToAll&nbsp;?
                </h2>
                <p class="mt-4 max-w-sm leading-relaxed ink-muted">
                    Chercher « good first issue » sur GitHub seul ne dit pas si le dépôt est clonable, accueillant, ou déjà pris.
                </p>
            </header>

            <dl class="lg:col-span-8 grid gap-x-10 sm:grid-cols-2">
                {% for item in why_items %}
                <div class="border-t ink-rule py-5">
                    <dt class="font-display text-lg font-semibold tracking-[-0.015em] ink-strong">{{ item.title }}</dt>
                    <dd class="mt-2 leading-relaxed ink-muted">{{ item.text }}</dd>
                </div>
                {% endfor %}
            </dl>
        </div>
    </div>
</section>
