<section id="why" class="max-w-content mx-auto px-4 lg:px-8 py-14 lg:py-16 border-t border-outline-variant/30" aria-labelledby="why-heading">
    <div class="max-w-xl mb-10">
        <h2 id="why-heading" class="font-display font-semibold text-2xl lg:text-3xl text-on-surface tracking-tight">Pourquoi OpenToAll ?</h2>
        <p class="mt-3 text-on-surface-variant text-lg leading-relaxed">Chercher « good first issue » sur GitHub seul ne dit pas si le dépôt est clonable, accueillant, ou déjà pris.</p>
    </div>

    <div class="grid md:grid-cols-2 gap-x-10 gap-y-8 max-w-4xl">
        {% for item in why_items %}
        <div class="flex gap-4">
            <span class="material-symbols-outlined text-primary text-[28px] shrink-0 mt-0.5" style="font-variation-settings:'FILL' 1;" aria-hidden="true">{{ item.icon }}</span>
            <div>
                <h3 class="font-heading font-semibold text-lg text-on-surface">{{ item.title }}</h3>
                <p class="mt-1.5 text-on-surface-variant leading-relaxed">{{ item.text }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
