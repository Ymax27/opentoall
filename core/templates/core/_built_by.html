<p class="{{ credit_class|default:'marginalia' }}">
    Built by
    <a href="{{ repo_owner_url }}" target="_blank" rel="noopener" class="{{ credit_link_class|default:'text-on-surface underline decoration-on-surface/25 underline-offset-2 hover:text-secondary hover:decoration-secondary transition-colors' }}">Ymax</a>
    et
    {% if repo_contributor_count != None %}
    <a href="{{ repo_contributors_url }}" target="_blank" rel="noopener" class="{{ credit_link_class|default:'text-on-surface underline decoration-on-surface/25 underline-offset-2 hover:text-secondary hover:decoration-secondary transition-colors' }}">{{ repo_contributor_count }} amazing contributor{{ repo_contributor_count|pluralize }}</a>
    {% else %}
    <a href="{{ repo_contributors_url }}" target="_blank" rel="noopener" class="{{ credit_link_class|default:'text-on-surface underline decoration-on-surface/25 underline-offset-2 hover:text-secondary hover:decoration-secondary transition-colors' }}">amazing contributors</a>
    {% endif %}
</p>
