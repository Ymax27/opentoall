<section id="faq" class="max-w-content mx-auto px-4 lg:px-8 py-14 lg:py-16" aria-labelledby="faq-heading">
    <div class="max-w-xl mb-8">
        <h2 id="faq-heading" class="font-display font-semibold text-2xl lg:text-3xl text-on-surface tracking-tight">Questions fréquentes</h2>
        <p class="mt-3 text-on-surface-variant text-lg leading-relaxed">Les réponses courtes avant de te lancer sur une issue.</p>
    </div>

    <div class="max-w-3xl divide-y divide-outline-variant/40 border-y border-outline-variant/40">
        {% for item in faq_items %}
        <details class="group py-4">
            <summary class="flex cursor-pointer list-none items-center justify-between gap-4 font-heading font-semibold text-on-surface marker:content-none [&::-webkit-details-marker]:hidden">
                <span>{{ item.question }}</span>
                <span class="material-symbols-outlined shrink-0 text-on-surface-variant transition-transform group-open:rotate-180" aria-hidden="true">expand_more</span>
            </summary>
            <p class="mt-3 pr-10 text-on-surface-variant leading-relaxed">{{ item.answer }}</p>
        </details>
        {% endfor %}
    </div>
</section>
